name = "chittyauth"
main = "worker.js"
compatibility_date = "2026-03-16"
compatibility_flags = ["nodejs_compat"]
account_id = "0bc21e3a5a9de1a4cc843be9c3e98121"  # ChittyCorp LLC main account

# Production environment
[env.production]

# Route configuration for auth.chitty.cc
[[env.production.routes]]
pattern = "auth.chitty.cc/*"
zone_name = "chitty.cc"

# KV Namespaces for Token Storage
[[env.production.kv_namespaces]]
binding = "AUTH_TOKENS"
id = "CREATE_NEW_KV_NAMESPACE"  # Run: wrangler kv:namespace create AUTH_TOKENS --env production

[[env.production.kv_namespaces]]
binding = "AUTH_REVOCATIONS"
id = "CREATE_NEW_KV_NAMESPACE"  # Run: wrangler kv:namespace create AUTH_REVOCATIONS --env production

[[env.production.kv_namespaces]]
binding = "AUTH_RATE_LIMITS"
id = "CREATE_NEW_KV_NAMESPACE"  # Run: wrangler kv:namespace create AUTH_RATE_LIMITS --env production

[[env.production.kv_namespaces]]
binding = "AUTH_AUDIT"
id = "CREATE_NEW_KV_NAMESPACE"  # Run: wrangler kv:namespace create AUTH_AUDIT --env production

# D1 Database for Token Persistence
[[env.production.d1_databases]]
binding = "AUTH_DB"
database_name = "chittyauth-db"
database_id = "CREATE_NEW_D1_DATABASE"  # Run: wrangler d1 create chittyauth-db

# Environment Variables
[env.production.vars]
ENVIRONMENT = "production"
CHITTYCONNECT_URL = "https://connect.chitty.cc"
CHITTYAUTH_PROVIDER = "local" # set to "neon" to enable Neon OAuth facade endpoints
NEON_OAUTH_HOST = "https://oauth2.neon.tech"
CHITTYROUTER_URL = "https://router.chitty.cc"
DEFAULT_TOKEN_EXPIRY = "2592000"  # 30 days in seconds
MAX_TOKENS_PER_USER = "10"

# Secrets (set via: wrangler secret put <NAME> --env production)
# CHITTYAUTH_ISSUED_MINT_API_KEY - canonical 256-bit token signing key
# CHITTYAUTH_ISSUED_CONNECT_API_KEY - canonical ChittyConnect service token
# NEON_OAUTH_CLIENT_ID - Neon OAuth app client id (when CHITTYAUTH_PROVIDER=neon)
# NEON_OAUTH_CLIENT_SECRET - Neon OAuth app client secret (when CHITTYAUTH_PROVIDER=neon)
# Legacy aliases still supported for migration:
# TOKEN_SIGNING_KEY
# CHITTYCONNECT_API_KEY

# Development environment
[env.development]

[[env.development.kv_namespaces]]
binding = "AUTH_TOKENS"
id = "CREATE_DEV_KV"

[[env.development.kv_namespaces]]
binding = "AUTH_REVOCATIONS"
id = "CREATE_DEV_KV"

[[env.development.kv_namespaces]]
binding = "AUTH_RATE_LIMITS"
id = "CREATE_DEV_KV"

[[env.development.kv_namespaces]]
binding = "AUTH_AUDIT"
id = "CREATE_DEV_KV"

[[env.development.d1_databases]]
binding = "AUTH_DB"
database_name = "chittyauth-dev-db"
database_id = "CREATE_DEV_D1"

[env.development.vars]
ENVIRONMENT = "development"
CHITTYCONNECT_URL = "https://connect-dev.chitty.cc"
CHITTYROUTER_URL = "https://router.chitty.cc"
DEFAULT_TOKEN_EXPIRY = "86400"  # 1 day for dev
MAX_TOKENS_PER_USER = "50"

# Compatibility settings
[build]
command = "npm run build"

[build.upload]
format = "modules"
main = "./worker.js"

[[tail_consumers]]
service = "chittytrack"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
destinations = ["chittytrack-logs"]

[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["chittytrack-traces"]
persist = false
